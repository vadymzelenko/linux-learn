<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- An app, not a document: no pinch zoom, full screen under the notch, the
         on-screen keyboard resizes the layout instead of scrolling the page. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0B0F14" />
    <!-- the app is translated already; browser auto-translation would garble terminal output -->
    <meta name="google" content="notranslate" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Learn the Linux terminal by doing: real commands in a safe simulated system. Free, offline, no account." />
    <title>Linux Terminal Trainer</title>
    <style id="expo-reset">
      /* The page itself never scrolls or bounces: only the app's own lists do.
         Height follows the visible area (dvh), not the area under the browser bars. */
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #0B0F14;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        position: fixed;
        inset: 0;
      }
      #root {
        display: flex;
        flex: 1;
        width: 100%;
        height: 100%;
        height: var(--app-height, 100dvh);
        overflow: hidden;
      }
    </style>
    <script>
      // older mobile browsers without dvh: track the visible height ourselves
      (function () {
        function set() {
          var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
          document.documentElement.style.setProperty('--app-height', h + 'px');
          window.scrollTo(0, 0);
        }
        set();
        window.addEventListener('resize', set);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', set);
        window.addEventListener('orientationchange', function () { setTimeout(set, 250); });
        // iOS ignores user-scalable=no: block pinch and double-tap zoom gestures
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      })();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
