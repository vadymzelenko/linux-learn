# Smoke test of the release APK on an emulator (run by .github/workflows/android.yml).
# Onboarding → first command → home → a lesson task solved from the keyboard.
appId: com.vadymzelenko.linuxtrainer
---
- launchApp:
    clearState: true
# the CI emulator is slow: a system "… isn't responding" dialog (usually the
# launcher) can cover the app — answer "Wait" until the app is visible
- repeat:
    times: 12
    while:
      notVisible: "English"
    commands:
      - tapOn:
          text: "Wait"
          optional: true
      # Android's one-time full-screen hint ("Viewing full screen … Got it")
      - tapOn:
          text: "Got it"
          optional: true
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible: "English"
    timeout: 60000
- tapOn: "English"
- takeScreenshot: 01-onboarding
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Your first command"
    timeout: 10000
- tapOn:
    text: "Got it"
    optional: true
# the command line is drawn by the app (no native text field): type with its keyboard
- tapOn: "p"
- tapOn: "w"
- tapOn: "d"
- tapOn: "Enter"
- extendedWaitUntil:
    visible: "Let’s go"
    timeout: 10000
- takeScreenshot: 02-first-command
- tapOn: "Let’s go"
- extendedWaitUntil:
    visible: "CONTINUE LEARNING"
    timeout: 10000
- takeScreenshot: 03-home
- tapOn: "Where am I.*"
- extendedWaitUntil:
    visible: "THEORY"
    timeout: 10000
- takeScreenshot: 04-theory
- tapOn: "Continue"
# the task: with the built-in keyboard open the goal card is a single line
- extendedWaitUntil:
    visible: "Find out which directory.*"
    timeout: 15000
- takeScreenshot: 05a-task-keyboard
# type with the built-in terminal keyboard
- tapOn: "p"
- tapOn: "w"
- tapOn: "d"
- tapOn: "Enter"
- extendedWaitUntil:
    visible: "Task solved.*"
    timeout: 10000
- takeScreenshot: 05-task-solved
# Back first closes the built-in keyboard, the next Back asks to leave
- repeat:
    times: 3
    while:
      notVisible: "Leave the lesson.*"
    commands:
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: "Leave the lesson.*"
    timeout: 5000
- takeScreenshot: 06-exit-dialog
- tapOn: "Back to the menu"
- assertVisible: "Courses"
- tapOn: "Sandbox"
- takeScreenshot: 07-sandbox
# a machine, typing and the always-visible "hide keyboard" button
- tapOn: "Clean system"
- tapOn: "Show keyboard"
- tapOn: "l"
- tapOn: "s"
- tapOn: "Enter"
- takeScreenshot: 08-sandbox-typing
- tapOn: "Hide keyboard"
- assertVisible: "Show keyboard"
- takeScreenshot: 09-sandbox-keyboard-hidden
