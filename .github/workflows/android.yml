name: Android

# Builds an installable APK (and an AAB for Google Play) and smoke-tests the APK
# on an emulator. Artifacts: Actions → this run → "Artifacts".
#
# Signing: with the repository secrets ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD the
# release is signed with the Play upload key; without them, with the debug key
# (installable on a phone, not accepted by Play).

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      # Play needs a growing versionCode on every upload
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile

      - name: Version name from the tag (v1.2.0 → 1.2.0)
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Upload key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Generate the native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build APK + AAB
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "out/linux-trainer-${{ github.run_number }}.apk"
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab "out/linux-trainer-${{ github.run_number }}.aab"
          ls -la out
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/aapt2 dump badging out/*.apk | grep -E "package:|uses-permission|sdkVersion|targetSdkVersion" | tee out/badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aab-for-google-play
          path: |
            out/*.aab
            out/badging.txt

  smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r apk/*.apk
            mkdir -p maestro-out
            adb logcat -c
            # a slow CI emulator sometimes shows "Pixel Launcher isn't responding" over the app: hide such system dialogs
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            maestro test apps/mobile/.maestro/smoke.yaml --format junit --output maestro-out/report.xml --test-output-dir maestro-out || (echo "::group::What is on screen"; maestro hierarchy | grep -oE '"(text|accessibilityText|resource-id)" *: *"[^"]+"' | head -80; echo "::endgroup::"; echo "::group::Crash / JS errors"; adb logcat -d -s ReactNativeJS:V AndroidRuntime:E ReactNative:E | tail -150; echo "::endgroup::"; adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" ; adb logcat -d > maestro-out/logcat.txt; exit 1)
            adb logcat -d -s ReactNativeJS:V AndroidRuntime:E > maestro-out/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshots
          path: maestro-out
