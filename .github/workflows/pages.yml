name: Website

# Publishes the product website (apps/mobile/public/site: home, privacy policy,
# support) and the browser version of the app to GitHub Pages with HTTPS:
#   https://vadymzelenko.github.io/linux-learn/          home
#   https://vadymzelenko.github.io/linux-learn/app/      the app in the browser
#   https://vadymzelenko.github.io/linux-learn/privacy/  privacy policy (Play Console URL)
#   https://vadymzelenko.github.io/linux-learn/support/  support
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main, 'claude/**']
    paths: ['apps/mobile/**', 'packages/**', 'pnpm-lock.yaml', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Is GitHub Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type > build_type.txt 2>/dev/null; then
            if [ "$(cat build_type.txt)" = "workflow" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            else
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=GitHub Pages source is a branch::Settings → Pages → Build and deployment → Source must be 'GitHub Actions' (now: $(cat build_type.txt)). Change it and run this workflow again. Publishing is skipped."
            fi
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is off::Enable it once: Settings → Pages → Build and deployment → Source: GitHub Actions, then run this workflow again (Actions → Website → Run workflow). Publishing is skipped."
          fi
      - uses: actions/checkout@v4
        if: steps.pages.outputs.enabled == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        if: steps.pages.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build the browser version of the app
        if: steps.pages.outputs.enabled == 'true'
        working-directory: apps/mobile
        env:
          WEB_BASE_URL: /linux-learn/app
        run: npx expo export --platform web --output-dir ../../_site/app
      - name: Build the site
        if: steps.pages.outputs.enabled == 'true'
        # The pages link to /site/... and the app to / (Vercel layout); rewrite the links for /linux-learn/.
        run: bash .github/scripts/pages-site.sh _site
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: _site
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
