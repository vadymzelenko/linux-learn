name: Website

# Publishes the product website (apps/mobile/public/site: home, privacy policy,
# support) to GitHub Pages with HTTPS:
#   https://vadymzelenko.github.io/linux-learn/          home
#   https://vadymzelenko.github.io/linux-learn/privacy/  privacy policy (Play Console URL)
#   https://vadymzelenko.github.io/linux-learn/support/  support
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main, 'claude/**']
    paths: ['apps/mobile/public/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Is GitHub Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type > build_type.txt 2>/dev/null; then
            if [ "$(cat build_type.txt)" = "workflow" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            else
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=GitHub Pages source is a branch::Settings → Pages → Build and deployment → Source must be 'GitHub Actions' (now: $(cat build_type.txt)). Change it and run this workflow again. Publishing is skipped."
            fi
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is off::Enable it once: Settings → Pages → Build and deployment → Source: GitHub Actions, then run this workflow again (Actions → Website → Run workflow). Publishing is skipped."
          fi
      - uses: actions/checkout@v4
        if: steps.pages.outputs.enabled == 'true'
      - name: Build the site
        if: steps.pages.outputs.enabled == 'true'
        # The pages link to /site/... (Vercel layout); rewrite the links for /linux-learn/.
        run: |
          set -e
          SRC=apps/mobile/public/site
          OUT=_site
          mkdir -p $OUT/privacy $OUT/support
          cp -r $SRC/img $SRC/style.css $OUT/
          fix() {
            sed -e 's#href="/site/privacy.html"#href="/linux-learn/privacy/"#g' \
                -e 's#href="/site/support.html"#href="/linux-learn/support/"#g' \
                -e 's#"/site/#"/linux-learn/#g' \
                -e 's#href="/"#href="/linux-learn/"#g' "$1" > "$2"
          }
          fix $SRC/index.html   $OUT/index.html
          fix $SRC/privacy.html $OUT/privacy/index.html
          fix $SRC/support.html $OUT/support/index.html
          cp $OUT/index.html $OUT/404.html
          touch $OUT/.nojekyll
          if grep -n '"/site/' $OUT/*.html $OUT/*/index.html; then echo "unrewritten links"; exit 1; fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: _site
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
